name: Pruebas del backend

# Corre en cada PR que toque el backend o la base, y lo reutiliza el deploy
# (deploy-backend.yml) para no publicar código que rompa el aislamiento (HU05).
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'db/**'
      - '.github/workflows/test-backend.yml'
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Contraseña desechable: solo existe dentro de este job, en un SQL Server que se borra al terminar.
      MSSQL_SA_PASSWORD: Pruebas_KontadorIA_2026!
      TEST_SQL_SERVER: 127.0.0.1
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Pruebas_KontadorIA_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Pruebas_KontadorIA_2026!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 20s
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar ODBC Driver 18 for SQL Server
        run: |
          if ! odbcinst -q -d | grep -q "ODBC Driver 18 for SQL Server"; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Correr pruebas (tokens, registro, empresa, RUT y aislamiento RLS)
        working-directory: backend
        run: python -m pytest -v
