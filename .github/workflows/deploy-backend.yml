name: Deploy Backend to Azure Function App

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}   # permite disparar el deploy manualmente desde la pestaña Actions

env:
  AZURE_FUNCTIONAPP_NAME: func-kontadoria
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'backend'
  PYTHON_VERSION: '3.13'

# Necesario para que GitHub emita el token OIDC que Azure valida contra la federated credential
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false   # evita cancelar un deploy en curso si llega un push nuevo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias (para validar antes de subir)
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Si tienen tests, este es el lugar para correrlos y frenar el deploy si fallan
      # - name: Correr tests
      #   working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
      #   run: pytest

      - name: Login en Azure (OIDC, sin passwords)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar en Azure Function App (Flex Consumption)
        uses: azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          remote-build: true   # el build (pip install) corre en Azure, requerido para Flex Consumption

      - name: Logout de Azure
        run: az logout
        if: always()
