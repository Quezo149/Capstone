# Servicios locales para desarrollo (ver 03 Arquitectura.md, tabla "Local vs Azure").
# Uso:  docker compose up -d    |    docker compose down
# La contraseña de SQL Server se lee de .env (copiar desde .env.example).

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kontadoria-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD en .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: kontadoria-azurite
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    volumes:
      - azurite-data:/data

volumes:
  sqlserver-data:
  azurite-data:
